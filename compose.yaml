services:
  web:
    build: .
    expose:
      - "8095"
    networks:
      - dokploy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOST: 0.0.0.0
      PORT: "8095"
      ROTATE_SECONDS: "${ROTATE_SECONDS:-15}"
      REFRESH_SECONDS: "${REFRESH_SECONDS:-180}"
      MAX_ITEMS: "${MAX_ITEMS:-14}"
      DATA_DIR: /app/data
    volumes:
      - headlines-data:/app/data
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  headlines-data:
    external: true
    name: "${HEADLINES_VOLUME_NAME:?Definir el nombre exacto del volumen existente en Dokploy}"

networks:
  dokploy-network:
    external: true
