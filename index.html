<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Deber - Titulares</title>
  <style>
    @font-face {
      font-family: "Flama Condensed";
      src: url("assets/fonts/FlamaCondensed-Medium.ttf") format("truetype");
      font-weight: 500;
    }

    @font-face {
      font-family: "Flama Condensed";
      src: url("assets/fonts/FlamaCondensed-Bold.ttf") format("truetype");
      font-weight: 700;
    }

    @font-face {
      font-family: "Flama Condensed";
      src: url("assets/fonts/FlamaCondensed-Black.ttf") format("truetype");
      font-weight: 900;
    }

    :root {
      --stage-width: 1920px;
      --stage-height: 1080px;
      --rail-width: 498px;
      --rail-height: 1080px;
      --broadcast-safe-height: 108px;
      --photo-height: 324px;
      --ed-green: #008f58;
      --ed-green-dark: #006b47;
      --panel: #f3f6f4;
      --ink: #10221a;
      --muted: #dfe9e4;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Flama Condensed", Arial, Helvetica, sans-serif;
    }

    .canvas {
      position: relative;
      width: var(--stage-width);
      height: var(--stage-height);
      background: transparent;
      transform: scale(var(--stage-scale, 1));
      transform-origin: top left;
    }

    .news-rail {
      position: absolute;
      top: 0;
      right: 0;
      width: var(--rail-width);
      height: var(--rail-height);
      display: grid;
      grid-template-rows: var(--broadcast-safe-height) minmax(0, 1fr);
      overflow: hidden;
      background: var(--panel);
      border: 4px solid var(--ed-green);
    }

    .broadcast-safe-area {
      background: var(--white);
    }

    .active-story {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: var(--photo-height) minmax(0, 1fr) 232px;
      background: var(--panel);
      transition: opacity 520ms ease, transform 520ms cubic-bezier(.22, .61, .36, 1);
    }

    .active-story.is-changing {
      opacity: 0;
      transform: translateX(20px);
    }

    .photo-wrap {
      position: relative;
      height: var(--photo-height);
      overflow: hidden;
      background: var(--muted);
      border-bottom: 5px solid var(--ed-green);
    }

    .photo-wrap::before {
      content: "";
      position: absolute;
      inset: -18px;
      background-image: var(--story-image);
      background-position: center;
      background-size: cover;
      filter: blur(13px) brightness(0.72) saturate(0.9);
      transform: scale(1.08);
    }

    .photo-wrap::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 44px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.18));
      pointer-events: none;
    }

    .photo-wrap img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      transform: scale(1.025);
      transition: transform 6.5s ease-out;
    }

    .active-story:not(.is-changing) .photo-wrap img { transform: scale(1); }

    .story-body {
      min-height: 0;
      padding: 28px 30px 24px;
      overflow: hidden;
    }

    .headline {
      margin: 0;
      padding-left: 20px;
      overflow: visible;
      border-left: 8px solid var(--ed-green);
      color: var(--ink);
      font-size: 68px;
      line-height: 1.02;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .category-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 192px;
      align-items: end;
      gap: 18px;
      padding: 0 24px 28px 58px;
      min-width: 0;
    }

    .story-qr {
      display: block;
      width: 192px;
      height: 192px;
      align-self: end;
      background: var(--white);
    }

    .story-qr[hidden] { display: none; }

    .story-qr img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .qr-caption {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 16px;
      height: 192px;
      min-width: 0;
    }

    .qr-callout {
      display: flex;
      align-items: center;
      align-self: center;
      gap: 10px;
      margin: 0;
      color: var(--ed-green-dark);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.12;
    }

    .qr-arrow {
      flex: 0 0 26px;
      color: var(--ed-green);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 32px;
      font-weight: 400;
      opacity: 0.75;
    }

    .category-row:has(.story-qr[hidden]) .qr-callout { visibility: hidden; }

    .section {
      display: inline-block;
      max-width: 100%;
      width: 100%;
      min-width: 0;
      padding: 18px 24px;
      overflow: hidden;
      border-radius: 4px;
      background: var(--ed-green);
      box-shadow: inset 0 -3px 0 var(--ed-green-dark);
      color: var(--white);
      font-size: 32px;
      line-height: 1.1;
      font-weight: 900;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <aside class="news-rail">
      <div class="broadcast-safe-area" aria-hidden="true"></div>
      <article id="activeStory" class="active-story">
        <div class="photo-wrap">
          <img id="storyImage" alt="">
        </div>
        <div class="story-body">
          <h1 id="storyTitle" class="headline">Cargando titular de El Deber</h1>
        </div>
        <div class="category-row">
          <div class="qr-caption">
            <p class="qr-callout">
              <span>Lee la nota completa</span>
              <span class="qr-arrow" aria-hidden="true">&rarr;</span>
            </p>
            <span id="storySection" class="section">PORTADA</span>
          </div>
          <a id="storyLink" class="story-qr" target="_blank" rel="noopener noreferrer"
             aria-label="Abrir noticia completa en El Deber" hidden>
            <img id="storyQr" alt="Codigo QR de la noticia" width="192" height="192">
          </a>
        </div>
      </article>
    </aside>
  </main>

  <script>
    const API_URL = "/api/headlines";
    let ROTATE_MS = 15000;
    let REFRESH_MS = 180000;

    const state = { items: [], index: 0, pendingItems: null };
    const activeStory = document.getElementById("activeStory");
    const storyImage = document.getElementById("storyImage");
    const photoWrap = document.querySelector(".photo-wrap");
    const storySection = document.getElementById("storySection");
    const storyTitle = document.getElementById("storyTitle");
    const storyBody = document.querySelector(".story-body");
    const storyLink = document.getElementById("storyLink");
    const storyQr = document.getElementById("storyQr");
    storyQr.onload = () => { storyQr.style.visibility = "visible"; };
    storyQr.onerror = () => { storyQr.style.visibility = "hidden"; };

    function fitHeadline() {
      const style = getComputedStyle(storyBody);
      const available = storyBody.clientHeight -
        parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      fitText(storyTitle, 68, 32, available);
    }

    function resizeStage() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.documentElement.style.setProperty("--stage-scale", String(scale));
    }

    resizeStage();
    window.addEventListener("resize", resizeStage);

    function safeText(value) {
      return String(value || "").trim();
    }

    function fitText(element, maxSize, minSize, maxHeight) {
      element.style.fontSize = `${maxSize}px`;
      let size = maxSize;
      while (size > minSize && (
        element.scrollHeight > maxHeight ||
        element.scrollWidth > element.clientWidth
      )) {
        size -= 1;
        element.style.fontSize = `${size}px`;
      }
    }

    function render() {
      if (!state.items.length) {
        storyTitle.textContent = "Sin conexion con El Deber";
        storyImage.removeAttribute("src");
        storySection.textContent = "PORTADA";
        storyLink.hidden = true;
        storyLink.removeAttribute("href");
        storyQr.removeAttribute("src");
        return;
      }

      const item = state.items[state.index % state.items.length];
      activeStory.classList.add("is-changing");

      window.setTimeout(() => {
        storyImage.src = item.image || "";
        const safeImageUrl = String(item.image || "").replace(/["'()\\]/g, "");
        photoWrap.style.setProperty("--story-image", `url("${safeImageUrl}")`);
        storyTitle.textContent = safeText(item.title);
        storySection.textContent = safeText(item.section) || "PORTADA";
        storyLink.hidden = !item.url;
        storyQr.style.visibility = "hidden";
        if (item.url) {
          storyLink.href = item.url;
          storyQr.src = `/api/qr.svg?url=${encodeURIComponent(item.url)}`;
        } else {
          storyLink.removeAttribute("href");
          storyQr.removeAttribute("src");
        }
        fitHeadline();
        activeStory.classList.remove("is-changing");
      }, 520);
    }

    async function loadHeadlines(force = false) {
      try {
        const response = await fetch(`${API_URL}${force ? "?force=1" : ""}`, {
          cache: "no-store",
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (!payload.items?.length) throw new Error(payload.error || "Sin titulares");
        if (!state.items.length) {
          state.items = payload.items;
          state.index = 0;
          render();
        } else {
          state.pendingItems = payload.items;
        }
      } catch (error) {
        console.error("No se pudieron cargar los titulares:", error);
        if (!state.items.length) render();
      }
    }

    function nextStory() {
      if (!state.items.length) {
        loadHeadlines();
        return;
      }
      const nextIndex = (state.index + 1) % state.items.length;
      if (state.pendingItems) {
        const nextUrl = state.items[nextIndex].url;
        state.items = state.pendingItems;
        state.pendingItems = null;
        const updatedIndex = state.items.findIndex((item) => item.url === nextUrl);
        state.index = updatedIndex >= 0 ? updatedIndex : 0;
      } else {
        state.index = nextIndex;
      }
      render();
    }

    async function start() {
      try {
        const response = await fetch("/api/config", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const config = await response.json();
        if (config.rotate_seconds >= 3) ROTATE_MS = config.rotate_seconds * 1000;
        if (config.refresh_seconds >= 30) REFRESH_MS = config.refresh_seconds * 1000;
      } catch (error) {
        console.error("No se pudo cargar la configuracion:", error);
      }
      await document.fonts.ready;
      await loadHeadlines();
      window.setInterval(nextStory, ROTATE_MS);
      window.setInterval(() => loadHeadlines(), REFRESH_MS);
    }

    start();
  </script>
</body>
</html>
